<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d22"><title>INFINITAS SCORE VIEWER</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand"><div class="brand-mark">Ⅱ<span>DX</span></div><div><h1>INFINITAS <em>SCORE VIEWER</em></h1><p>YOUR SCORES, YOUR WAY.</p></div></div><div class="top-actions"><button id="importBtn" class="primary">＋ CSVを読み込む</button><button id="resetBtn" class="ghost" title="保存データを削除">データ削除</button></div></header>
<main><section class="upload" id="dropZone"><div class="upload-icon">⇧</div><div><strong>公式スコアCSVをここにドロップ</strong><p>またはファイルを選択（SP・DPをまとめて選択可能）</p></div><button id="chooseBtn" class="outline">ファイルを選択</button><input id="fileInput" type="file" accept=".csv,text/csv" multiple hidden></section>
<div id="status" class="status" role="status" aria-live="polite"></div>
<section class="summary"><div class="stat"><span>登録曲数</span><strong id="songs">—</strong><small>現在のモード</small></div><div class="stat"><span>プレー済み譜面</span><strong id="played">—</strong><small>CSVに記録された譜面</small></div><div class="stat"><span>総プレー回数</span><strong id="plays">—</strong><small>全譜面合計</small></div><div class="stat"><span>FULLCOMBO</span><strong id="fc">—</strong><small>ランプ数</small></div></section>
<section class="workspace"><div class="section-head"><div><span class="eyebrow">SCORE LIBRARY</span><h2>スコア一覧 <span id="count">0件</span></h2></div><div class="mode-tabs" role="group" aria-label="プレーモード"><button class="active" data-mode="DP">DOUBLE PLAY</button><button data-mode="SP">SINGLE PLAY</button></div></div>
<div class="filters"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="曲名・アーティスト・バージョンで検索"></label><div class="filter-grid"><div class="multi-field"><span class="filter-label">難易度</span><div class="multi-select" id="difficulty"><button type="button" class="multi-trigger" aria-expanded="false" aria-haspopup="true">すべて <span class="chevron">▾</span></button><div class="multi-menu" hidden></div></div></div><div class="multi-field"><span class="filter-label">クリアランプ</span><div class="multi-select" id="lamp"><button type="button" class="multi-trigger" aria-expanded="false" aria-haspopup="true">すべて <span class="chevron">▾</span></button><div class="multi-menu" hidden></div></div></div><div class="multi-field"><span class="filter-label">バージョン</span><div class="multi-select" id="version"><button type="button" class="multi-trigger" aria-expanded="false" aria-haspopup="true">すべて <span class="chevron">▾</span></button><div class="multi-menu" hidden></div></div></div><label>プレー状況<select id="playedFilter"><option value="">すべて</option><option value="played">プレー済み</option><option value="unplayed">NO PLAY</option></select></label><label>並び替え<select id="sort"><option value="lastPlay">最終プレー日時</option><option value="score">EXスコア</option><option value="plays">プレー回数</option><option value="miss">ミスカウント</option><option value="scoreUpdated">最終スコア更新日時</option><option value="title">曲名</option><option value="version">バージョン</option><option value="difficulty">難易度</option><option value="lamp">クリアランプ</option></select></label><label>並び順<select id="direction"><option value="desc">降順（大きい・新しい順）</option><option value="asc">昇順（小さい・古い順）</option></select></label></div><div class="filter-actions"><button id="clearBtn" class="ghost">フィルタをリセット</button><button id="columnsBtn" class="ghost">表示列を設定</button><button id="exportBtn" class="outline">絞り込み結果をCSV保存</button></div><div id="columnPanel" class="column-panel" hidden></div></div>
<div class="table-wrap"><table><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div><div id="cards" class="cards"></div><div id="empty" class="empty" hidden>該当するデータがありません。CSVの読み込みやフィルタ条件を確認してね。</div><div class="pagination"><span id="pageInfo"></span><div><button id="prevBtn" class="ghost">前へ</button><button id="nextBtn" class="ghost">次へ</button></div></div></section>
<footer>INFINITAS SCORE VIEWER · Local-first CSV Viewer · 非公式ファンツール</footer></main>
<dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button id="closeDetail" class="ghost" aria-label="閉じる">✕</button></div><div id="detailContent"></div></dialog><script src="app.js" defer></script></body></html>
